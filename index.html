<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6c5ce7">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com https://securetoken.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="מחול ישראלי">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>מועדון מחול ישראלי</title>
    <style>
        :root { --primary: #6c5ce7; --primary-dark: #5b4bd5; --bg: #f8f9fa; --text: #2d3436; --muted: #636e72; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
        .screen { display: none; min-height: 100vh; padding: 24px 20px; max-width: 480px; margin: 0 auto; flex-direction: column; }
        .screen.active { display: flex; }
        h1 { margin: 0; font-size: 1.9rem; line-height: 1.3; }
        h2 { margin: 0 0 16px; font-size: 1.4rem; }
        .center { align-items: center; justify-content: center; text-align: center; }
        .logo { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 24px rgba(0,0,0,.15); margin-bottom: 26px; }
        .welcome-sub { color: var(--muted); margin: 10px 0 34px; font-size: 1.05rem; }
        .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 16px; font-size: 1.15rem; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; text-align: center; text-decoration: none; }
        .btn:active { background: var(--primary-dark); }
        .btn-light { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
        .btn-link { background: none; color: var(--primary); font-weight: 600; font-size: 1rem; padding: 10px; }
        .topbar { display: flex; align-items: center; margin-bottom: 20px; }
        .back { background: none; border: none; font-size: 1.05rem; color: var(--primary); cursor: pointer; padding: 6px 0; font-weight: 600; }
        .menu { display: grid; gap: 16px; margin-top: 8px; }
        .menu-card { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 16px; padding: 22px 18px; box-shadow: 0 2px 12px rgba(0,0,0,.08); border: none; width: 100%; text-align: right; cursor: pointer; font-size: 1.15rem; color: var(--text); font-weight: 700; }
        .menu-card .ico { font-size: 2rem; }
        .menu-card small { display: block; font-weight: 400; color: var(--muted); font-size: .9rem; margin-top: 3px; }
        .hint { margin-top: 26px; text-align: center; color: var(--muted); font-size: .95rem; }
        .promo { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
        .promo h3 { margin: 0 0 6px; color: var(--primary); }
        .promo p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
        .promo .until { margin-top: 8px; font-size: .85rem; color: var(--muted); }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
        .sheet-bg.open { display: flex; }
        .sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 22px 20px 26px; }
        .sheet h3 { margin: 0 0 6px; }
        .sheet p { color: var(--muted); margin: 0 0 16px; }
        .sheet .btn { margin-top: 10px; }
        .status { min-height: 22px; margin-top: 12px; text-align: center; font-size: .95rem; color: var(--muted); }
        .status.err { color: #d63031; }
        #qr-wrap { display: none; margin-top: 12px; }
        #qr-video { width: 100%; border-radius: 12px; background: #000; }
    </style>
</head>
<body>
    <!-- Screen 1: welcome -->
    <main id="screen-welcome" class="screen center active">
        <img class="logo" src="LOGO.jpg" alt="מועדון מחול ישראלי">
        <h1>ברוכים הבאים<br>למועדון מחול ישראלי</h1>
        <p class="welcome-sub">שמחים לראות אתכם</p>
        <button class="btn" id="btn-enter">כניסה</button>
    </main>

    <!-- Screen 2: menu -->
    <main id="screen-menu" class="screen">
        <div class="topbar"><button class="back" data-go="welcome">→ חזרה</button></div>
        <h2>מה תרצו לעשות?</h2>
        <div class="menu">
            <button class="menu-card" id="btn-promos">
                <span class="ico">🎁</span>
                <span>מבצעים<small>הצעות והטבות למועדון</small></span>
            </button>
            <button class="menu-card" id="btn-card">
                <span class="ico">🎫</span>
                <span>הכרטיסיה שלי<small>יתרה, היסטוריית כניסות וכרטיס אישי</small></span>
            </button>
        </div>
        <p class="hint">📱 יש לכם כרטיס NFC? הצמידו אותו לגב הטלפון ותגיעו ישר לכרטיסיה.</p>
    </main>

    <!-- Screen 3: promotions -->
    <main id="screen-promos" class="screen">
        <div class="topbar"><button class="back" data-go="menu">→ חזרה</button></div>
        <h2>🎁 מבצעים</h2>
        <div id="promos-list"><div class="empty">טוען...</div></div>
    </main>

    <!-- Identify sheet (shown when this device doesn't know the member yet) -->
    <div class="sheet-bg" id="identify">
        <div class="sheet" role="dialog" aria-modal="true">
            <h3>זיהוי לכרטיסיה</h3>
            <p>כדי להציג את הכרטיסיה שלכם, זהו את עצמכם באחת הדרכים:</p>
            <button class="btn" id="btn-nfc">📱 הצמדת כרטיס NFC</button>
            <button class="btn btn-light" id="btn-scan">📷 סריקת QR אישי</button>
            <div id="qr-wrap"><video id="qr-video" playsinline muted></video></div>
            <div class="status" id="identify-status"></div>
            <a class="btn btn-link" href="register.html">עדיין לא רשומים? להרשמה</a>
            <button class="btn btn-link" id="btn-close-identify">סגירה</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js" integrity="sha384-tlQhrgxJ7V8OZx+VXHj3tR81OL53pwpHSTPcnSH/OiwNCFBgaP2tHIZBxaaAnmN+" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js" integrity="sha384-NyS+76PC8Zd+8ZXc1NXFxTHo1EJ5Y+grz8BQwehM4fFwD2ZgZKzGIZrezfZAeb6s" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js" integrity="sha384-ynIEJh/LF4vc94kBn86PdxiRZ74YxQohjabfR2wcK6IJ1FGNQEuOMAAOn8RTiXVQ" crossorigin="anonymous"></script>
    <script src="jsQR.js"></script>
    <script src="home.js?v=1"></script>
</body>
</html>
